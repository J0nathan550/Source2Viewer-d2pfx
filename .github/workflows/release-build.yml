name: Release Build

permissions:
  contents: read

# Releases are only made on demand, from the "Run workflow" button in the Actions tab
on:
  workflow_dispatch:

# Releases run one at a time, so each one sees the tag of the previous one when picking its build number
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  SKIP_ANALYSIS: -p:RunAnalyzersDuringBuild=false
  PUBLISH_ARGS: -p:PublishReadyToRun=true

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest

    outputs:
      build: ${{ steps.version.outputs.build }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
    - uses: actions/checkout@v7

    # Builds are numbered sequentially: a pushed "build-4" tag is build number 4, and anything else gets
    # the number after the highest "build-N" tag in the repository and is released as "build-N".
    # The version counts that many builds up from ProjectBaseVersion in Directory.Build.props, with the
    # last three parts rolling over at 10, so build 10 of 1.0.0 is 1.0.1.0 and build 11 is 1.0.1.1.
    # A pushed "1.2.3.4" tag is used as the version as is.
    - name: Determine version from git tags
      id: version
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail

        base=$(sed -n 's:.*<ProjectBaseVersion>\(.*\)</ProjectBaseVersion>.*:\1:p' Directory.Build.props)

        if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::ProjectBaseVersion '$base' in Directory.Build.props must be major.minor.patch"
          exit 1
        fi

        if [[ "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^build-([0-9]+)$ ]]; then
          build=$(( 10#${BASH_REMATCH[1]} ))
        else
          last=$(git ls-remote --tags --refs origin \
            | sed -nE 's#^.*refs/tags/build-([0-9]+)$#\1#p' \
            | sort -n | tail -n 1)
          build=$(( 10#${last:-0} + 1 ))
        fi

        tag=$([[ "$REF_TYPE" == "tag" ]] && echo "$REF_NAME" || echo "build-$build")

        if [[ "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
          major=$(( 10#${BASH_REMATCH[1]} ))
          minor=$(( 10#${BASH_REMATCH[2]} ))
          patch=$(( 10#${BASH_REMATCH[3]} ))
          revision=$(( 10#${BASH_REMATCH[4]} ))
        else
          IFS=. read -r major minor patch <<< "$base"
          revision=$(( build % 10 ))
          patch=$(( 10#$patch + build / 10 ))
          minor=$(( 10#$minor + patch / 10 ))
          patch=$(( patch % 10 ))
          major=$(( 10#$major + minor / 10 ))
          minor=$(( minor % 10 ))
        fi

        # Each version part is stored as a 16-bit number in the exe and dll metadata
        for part in "$major" "$minor" "$patch" "$revision"; do
          if (( part > 65534 )); then
            echo "::error::Version part $part is too large"
            exit 1
          fi
        done

        version="$major.$minor.$patch.$revision"

        {
          echo "build=$build"
          echo "version=$version"
          echo "tag=$tag"
        } >> "$GITHUB_OUTPUT"

        echo "Version **$version**, released as \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

  cli:
    name: CLI (${{ matrix.rid }})
    needs: version

    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          rid: win-x64
          artifact: cli-windows-x64
        - os: ubuntu-latest
          rid: linux-x64
          artifact: cli-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-dotnet-cache

    - name: Publish CLI
      run: dotnet publish --configuration Release --self-contained --runtime ${{ matrix.rid }} ${{ env.SKIP_ANALYSIS }} ${{ env.PUBLISH_ARGS }} -p:ProjectVersion=${{ needs.version.outputs.version }} -p:ProjectBuildNumber=${{ needs.version.outputs.build }} CLI/CLI.csproj

    - name: Upload CLI artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: |
          CLI/bin/Release/${{ matrix.rid }}/publish
          !**/*.pdb

  gui:
    name: GUI (win-x64)
    needs: version
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-dotnet-cache

    - name: Publish GUI
      run: dotnet publish --configuration Release --self-contained --runtime win-x64 ${{ env.SKIP_ANALYSIS }} ${{ env.PUBLISH_ARGS }} -p:ProjectVersion=${{ needs.version.outputs.version }} -p:ProjectBuildNumber=${{ needs.version.outputs.build }} GUI/GUI.csproj

    # The in-app updater only installs an executable whose hash this workflow attested,
    # on master for dev builds and on the release tag for stable builds
    - name: Attest build provenance
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: GUI/bin/Release/win-x64/publish/Source2Viewer.exe

    - name: Upload GUI artifact
      uses: actions/upload-artifact@v7
      with:
        name: gui-windows-x64
        path: |
          GUI/bin/Release/win-x64/publish
          !**/*.pdb

  gui-avalonia:
    name: Avalonia GUI (${{ matrix.rid }})
    needs: version

    strategy:
      fail-fast: false
      matrix:
        include:
        # A single executable, which is what the in-app updater downloads and swaps in place
        - os: windows-latest
          rid: win-x64
          artifact: gui-avalonia-windows-x64
          publish-args: -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          update-file: GUI.Avalonia/bin/Release/win-x64/publish/Source2Viewer.Avalonia.exe
          upload-path: GUI.Avalonia/bin/Release/win-x64/publish
        # The whole publish folder packed into an AppImage, which the in-app updater swaps in place
        - os: ubuntu-latest
          rid: linux-x64
          artifact: gui-avalonia-linux-x64
          publish-args: ''
          update-file: appimage/Source2Viewer-x86_64.AppImage
          upload-path: appimage/Source2Viewer-x86_64.AppImage

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-dotnet-cache

    - name: Publish Avalonia GUI
      run: dotnet publish --configuration Release --self-contained --runtime ${{ matrix.rid }} ${{ env.SKIP_ANALYSIS }} ${{ env.PUBLISH_ARGS }} ${{ matrix.publish-args }} -p:ProjectVersion=${{ needs.version.outputs.version }} -p:ProjectBuildNumber=${{ needs.version.outputs.build }} GUI.Avalonia/GUI.Avalonia.csproj

    - name: Create AppImage
      if: matrix.rid == 'linux-x64'
      env:
        APPIMAGETOOL_VERSION: '1.9.0'
      run: |
        set -euxo pipefail

        appdir=appimage/AppDir
        mkdir -p "$appdir/usr/bin"
        cp -a GUI.Avalonia/bin/Release/linux-x64/publish/. "$appdir/usr/bin/"
        find "$appdir/usr/bin" -name '*.pdb' -delete
        chmod +x "$appdir/usr/bin/Source2Viewer.Avalonia"

        cat > "$appdir/AppRun" << 'EOF'
        #!/bin/sh
        here="$(dirname "$(readlink -f "$0")")"
        exec "$here/usr/bin/Source2Viewer.Avalonia" "$@"
        EOF
        chmod +x "$appdir/AppRun"

        cat > "$appdir/source2viewer.desktop" << 'EOF'
        [Desktop Entry]
        Type=Application
        Name=Source 2 Viewer
        Comment=Browse, view and export Source 2 resources
        Exec=Source2Viewer.Avalonia %F
        Icon=source2viewer
        Categories=Graphics;Viewer;Development;
        Terminal=false
        EOF

        cp Misc/Icons/source2viewer.png "$appdir/source2viewer.png"
        ln -s source2viewer.png "$appdir/.DirIcon"

        # appimagetool validates the desktop entry and refuses to run without the validator
        sudo apt-get update -qq
        sudo apt-get install -y -qq desktop-file-utils

        curl -fsSL --retry 3 -o appimage/appimagetool "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
        chmod +x appimage/appimagetool

        # The runner has no FUSE, so the tool runs from its extracted contents
        APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 appimage/appimagetool --no-appstream "$appdir" ${{ matrix.update-file }}

    # The in-app updater only installs a file whose hash this workflow attested,
    # on master for dev builds and on the release tag for stable builds
    - name: Attest build provenance
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: ${{ matrix.update-file }}

    - name: Upload Avalonia GUI artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: |
          ${{ matrix.upload-path }}
          !**/*.pdb

  release:
    name: Create release
    needs: [version, cli, gui, gui-avalonia]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Create release archives
      run: |
        set -eux
        mkdir release
        chmod +x artifacts/cli-linux-x64/Source2Viewer-CLI
        zip -9j release/cli-windows-x64.zip artifacts/cli-windows-x64/*
        zip -9j release/cli-linux-x64.zip artifacts/cli-linux-x64/*
        zip -9j release/gui-windows-x64.zip artifacts/gui-windows-x64/*
        zip -9j release/gui-avalonia-windows-x64.zip artifacts/gui-avalonia-windows-x64/*
        # The in-app updater downloads the bare executable or the AppImage and swaps it in place
        cp artifacts/gui-windows-x64/Source2Viewer.exe release/Source2Viewer.exe
        cp artifacts/gui-avalonia-windows-x64/Source2Viewer.Avalonia.exe release/Source2Viewer.Avalonia.exe
        cp artifacts/gui-avalonia-linux-x64/Source2Viewer-x86_64.AppImage release/Source2Viewer-x86_64.AppImage

    # latest.json is what the in-app updater reads, from whichever release is the latest one.
    # It describes both channels, so the entry for the other channel is carried over from the
    # previous release's manifest. Tags are the stable channel, master builds are the dev channel.
    - name: Create update manifest
      env:
        REPOSITORY: ${{ github.repository }}
        REF: ${{ github.ref }}
        REF_TYPE: ${{ github.ref_type }}
        TAG: ${{ needs.version.outputs.tag }}
        VERSION: ${{ needs.version.outputs.version }}
        BUILD: ${{ needs.version.outputs.build }}
      run: |
        set -euo pipefail

        if ! curl -fsSL --retry 3 "https://github.com/$REPOSITORY/releases/latest/download/latest.json" -o previous.json || ! jq -e 'type == "object"' previous.json > /dev/null; then
          echo "::warning::No previous update manifest found, starting a new one"
          echo '{}' > previous.json
        fi

        # Each GUI build is found by the key it asks for: the WinForms GUI by its runtime identifier,
        # the Avalonia GUI by its runtime identifier prefixed with "avalonia-"
        asset() {
          local key=$1 file=$2
          local name
          name=$(basename "$file")

          jq -n \
            --arg key "$key" \
            --arg name "$name" \
            --arg url "https://github.com/$REPOSITORY/releases/download/$TAG/$name" \
            --argjson size "$(stat -c %s "$file")" \
            --arg sha256 "$(sha256sum "$file" | cut -d ' ' -f 1)" \
            '{($key): {name: $name, url: $url, size: $size, sha256: $sha256}}'
        }

        assets=$({
          asset win-x64 release/Source2Viewer.exe
          asset avalonia-win-x64 release/Source2Viewer.Avalonia.exe
          asset avalonia-linux-x64 release/Source2Viewer-x86_64.AppImage
        } | jq -s 'add')

        if [[ "$REF_TYPE" == "tag" ]]; then
          jq --arg version "$VERSION" --arg tag "$TAG" --arg notes "https://github.com/$REPOSITORY/releases/tag/$TAG" --argjson assets "$assets" \
            '.stable = {version: $version, tag: $tag, releaseNotesUrl: $notes, assets: $assets}' previous.json > release/latest.json
        elif [[ "$REF" == "refs/heads/master" ]]; then
          jq --arg version "$VERSION" --argjson build "$BUILD" --argjson assets "$assets" \
            '.dev = {version: $version, buildNumber: $build, assets: $assets}' previous.json > release/latest.json
        else
          # The updater only accepts dev builds attested on master
          echo "::warning::$REF is not master, the update manifest is carried over unchanged"
          cp previous.json release/latest.json
        fi

        cat release/latest.json

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.version.outputs.tag }}
        name: Build ${{ needs.version.outputs.build }} (${{ needs.version.outputs.version }})
        # Tag the commit that was built, not whatever the branch points at by the time this runs
        target_commitish: ${{ github.sha }}
        # The updater reads latest.json from the latest release, so every release must become it
        make_latest: true
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
