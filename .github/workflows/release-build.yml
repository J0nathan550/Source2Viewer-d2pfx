name: Release Build

permissions:
  contents: read

on:
  push:
    branches:
    - master
    tags:
    - '*'
    paths-ignore:
    - '.github/*_TEMPLATE/**'
    - 'docs/**'
    - '*.md'
  workflow_dispatch:

# Releases run one at a time, so each one sees the tag of the previous one when picking its build number
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  SKIP_ANALYSIS: -p:RunAnalyzersDuringBuild=false
  PUBLISH_ARGS: -p:PublishReadyToRun=true

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest

    outputs:
      base: ${{ steps.version.outputs.base }}
      build: ${{ steps.version.outputs.build }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
    - uses: actions/checkout@v7

    # A pushed "1.2.3.4" tag is used as the version and a pushed "build-4" tag as build number 4.
    # Anything else gets the number after the highest "build-N" or "x.y.z.N" tag in the repository,
    # on top of ProjectBaseVersion from Directory.Build.props, and is released as "build-N".
    - name: Determine version from git tags
      id: version
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail

        base=$(sed -n 's:.*<ProjectBaseVersion>\(.*\)</ProjectBaseVersion>.*:\1:p' Directory.Build.props)

        if [[ "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
          base="${BASH_REMATCH[1]}"
          build="${BASH_REMATCH[2]}"
          tag="$REF_NAME"
        elif [[ "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^build-([0-9]+)$ ]]; then
          build="${BASH_REMATCH[1]}"
          tag="$REF_NAME"
        else
          last=$(git ls-remote --tags --refs origin \
            | sed -nE 's#^.*refs/tags/(build-|v?[0-9]+\.[0-9]+\.[0-9]+\.)([0-9]+)$#\2#p' \
            | sort -n | tail -n 1)
          build=$(( 10#${last:-0} + 1 ))
          tag=$([[ "$REF_TYPE" == "tag" ]] && echo "$REF_NAME" || echo "build-$build")
        fi

        if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::ProjectBaseVersion '$base' in Directory.Build.props must be major.minor.patch"
          exit 1
        fi

        build=$(( 10#$build ))

        # Each version part is stored as a 16-bit number in the exe and dll metadata
        if (( build > 65534 )); then
          echo "::error::Build number $build is too large"
          exit 1
        fi

        version="$base.$build"

        {
          echo "base=$base"
          echo "build=$build"
          echo "version=$version"
          echo "tag=$tag"
        } >> "$GITHUB_OUTPUT"

        echo "Version **$version**, released as \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

  cli:
    name: CLI (${{ matrix.rid }})
    needs: version

    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          rid: win-x64
          artifact: cli-windows-x64
        - os: ubuntu-latest
          rid: linux-x64
          artifact: cli-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-dotnet-cache

    - name: Publish CLI
      run: dotnet publish --configuration Release --self-contained --runtime ${{ matrix.rid }} ${{ env.SKIP_ANALYSIS }} ${{ env.PUBLISH_ARGS }} -p:ProjectBaseVersion=${{ needs.version.outputs.base }} -p:ProjectBuildNumber=${{ needs.version.outputs.build }} CLI/CLI.csproj

    - name: Upload CLI artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: |
          CLI/bin/Release/${{ matrix.rid }}/publish
          !**/*.pdb

  gui:
    name: GUI (win-x64)
    needs: version
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-dotnet-cache

    - name: Publish GUI
      run: dotnet publish --configuration Release --self-contained --runtime win-x64 ${{ env.SKIP_ANALYSIS }} ${{ env.PUBLISH_ARGS }} -p:ProjectBaseVersion=${{ needs.version.outputs.base }} -p:ProjectBuildNumber=${{ needs.version.outputs.build }} GUI/GUI.csproj

    # The in-app updater only installs an executable whose hash this workflow attested,
    # on master for dev builds and on the release tag for stable builds
    - name: Attest build provenance
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: GUI/bin/Release/win-x64/publish/Source2Viewer.exe

    - name: Upload GUI artifact
      uses: actions/upload-artifact@v7
      with:
        name: gui-windows-x64
        path: |
          GUI/bin/Release/win-x64/publish
          !**/*.pdb

  release:
    name: Create release
    needs: [version, cli, gui]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Create release archives
      run: |
        set -eux
        mkdir release
        chmod +x artifacts/cli-linux-x64/Source2Viewer-CLI
        zip -9j release/cli-windows-x64.zip artifacts/cli-windows-x64/*
        zip -9j release/cli-linux-x64.zip artifacts/cli-linux-x64/*
        zip -9j release/gui-windows-x64.zip artifacts/gui-windows-x64/*
        # The in-app updater downloads the bare executable and swaps it in place
        cp artifacts/gui-windows-x64/Source2Viewer.exe release/Source2Viewer.exe

    # latest.json is what the in-app updater reads, from whichever release is the latest one.
    # It describes both channels, so the entry for the other channel is carried over from the
    # previous release's manifest. Tags are the stable channel, master builds are the dev channel.
    - name: Create update manifest
      env:
        REPOSITORY: ${{ github.repository }}
        REF: ${{ github.ref }}
        REF_TYPE: ${{ github.ref_type }}
        TAG: ${{ needs.version.outputs.tag }}
        VERSION: ${{ needs.version.outputs.version }}
        BUILD: ${{ needs.version.outputs.build }}
      run: |
        set -euo pipefail

        if ! curl -fsSL --retry 3 "https://github.com/$REPOSITORY/releases/latest/download/latest.json" -o previous.json || ! jq -e 'type == "object"' previous.json > /dev/null; then
          echo "::warning::No previous update manifest found, starting a new one"
          echo '{}' > previous.json
        fi

        exe=release/Source2Viewer.exe
        asset=$(jq -n \
          --arg name "Source2Viewer.exe" \
          --arg url "https://github.com/$REPOSITORY/releases/download/$TAG/Source2Viewer.exe" \
          --argjson size "$(stat -c %s "$exe")" \
          --arg sha256 "$(sha256sum "$exe" | cut -d ' ' -f 1)" \
          '{"win-x64": {name: $name, url: $url, size: $size, sha256: $sha256}}')

        if [[ "$REF_TYPE" == "tag" ]]; then
          jq --arg version "$VERSION" --arg tag "$TAG" --arg notes "https://github.com/$REPOSITORY/releases/tag/$TAG" --argjson assets "$asset" \
            '.stable = {version: $version, tag: $tag, releaseNotesUrl: $notes, assets: $assets}' previous.json > release/latest.json
        elif [[ "$REF" == "refs/heads/master" ]]; then
          jq --argjson build "$BUILD" --argjson assets "$asset" \
            '.dev = {buildNumber: $build, assets: $assets}' previous.json > release/latest.json
        else
          # The updater only accepts dev builds attested on master
          echo "::warning::$REF is not master, the update manifest is carried over unchanged"
          cp previous.json release/latest.json
        fi

        cat release/latest.json

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.version.outputs.tag }}
        name: Build ${{ needs.version.outputs.build }} (${{ needs.version.outputs.version }})
        # Tag the commit that was built, not whatever the branch points at by the time this runs
        target_commitish: ${{ github.sha }}
        # The updater reads latest.json from the latest release, so every release must become it
        make_latest: true
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
