name: CI

permissions:
  contents: read

# Only run on demand from the "Run workflow" button in the Actions tab.
# Release artifacts are built by release-build.yml.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  SKIP_ANALYSIS: -p:RunAnalyzersDuringBuild=false

jobs:
  build:
    name: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-dotnet-cache

    - name: Run tests
      run: dotnet test --project ./Tests/Tests.csproj --configuration Release --minimum-expected-tests 400 ${{ env.SKIP_ANALYSIS }}

#    - name: Check formatting
#      if: matrix.os == 'ubuntu-latest'
#      run: dotnet format --verify-no-changes

    - name: Build misc projects
      if: matrix.os == 'ubuntu-24.04-arm'
      run: dotnet build Misc/MiscVrfProjects.slnx

  analyze:
    name: Run all analyzers
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-dotnet-cache

    - name: Build
      run: dotnet build --configuration Release ValveResourceFormat.slnx
